play_station:
  target:
    entity:
      integration: home_radio
      domain: media_player
  fields:
    station:
      required: true
      example: vanilla_radio
      selector:
        text:
play_youtube:
  target:
    entity:
      integration: home_radio
      domain: media_player
  fields:
    query:
      example: Παπακωνσταντίνου
      selector:
        text:
    url:
      example: https://www.youtube.com/watch?v=dQw4w9WgXcQ
      selector:
        text:
search_youtube:
  target:
    entity:
      integration: home_radio
      domain: media_player
  fields:
    query:
      required: true
      example: Βασίλης Παπακωνσταντίνου
      selector:
        text:
play_cast:
  target:
    entity:
      integration: home_radio
      domain: media_player
  fields:
    video_id:
      required: true
      example: dQw4w9WgXcQ
      selector:
        text:
    position:
      example: 0
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
    sender:
      example: Pixel 8
      selector:
        text:
play_spotify:
  target:
    entity:
      integration: home_radio
      domain: media_player
  fields:
    url:
      required: true
      example: https://open.spotify.com/playlist/37i9dQZF1DXcBWIGoYBM5M
      selector:
        text:
get_list:
  target:
    entity:
      integration: home_radio
      domain: media_player
  fields:
    list:
      required: true
      example: Today's Top Hits
      selector:
        text:
set_crossfade:
  target:
    entity:
      integration: home_radio
      domain: media_player
  fields:
    seconds:
      required: true
      example: 6
      selector:
        number:
          min: 0
          max: 12
          unit_of_measurement: s
remove_list:
  target:
    entity:
      integration: home_radio
      domain: media_player
  fields:
    list:
      required: true
      example: Today's Top Hits
      selector:
        text:
